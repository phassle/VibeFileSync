name: "Feature"
description: "A spec/PRD — normally produced by the /to-spec skill, not filled in by hand. Sits under an Epic or Idea."
title: "[Feature] "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        A **Feature** is a spec (PRD) for one piece of buildable work. It is normally generated by the `/to-spec` skill from a conversation, not written from a blank template — this form exists so the shape is consistent either way.

        Write everything in English, even if the discussion that produced it happened in another language.

  - type: input
    id: parent
    attributes:
      label: Parent (Epic or Idea)
      description: Link (or #number) of the Epic or Idea this Feature belongs to, if any.
    validations:
      required: false

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: The problem the user is facing, from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: The solution to the problem, from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: User Stories
      description: "A long, numbered list: 1. As a <actor>, I want a <feature>, so that <benefit>."
    validations:
      required: true

  - type: textarea
    id: implementation-decisions
    attributes:
      label: Implementation Decisions
      description: Modules built/modified, interfaces, architectural decisions, schema changes, API contracts. No file paths or code snippets — they go stale.
    validations:
      required: false

  - type: textarea
    id: testing-decisions
    attributes:
      label: Testing Decisions
      description: What makes a good test here, which modules will be tested, prior art for the tests.
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What this Feature deliberately does not cover.
    validations:
      required: false

  - type: textarea
    id: further-notes
    attributes:
      label: Further Notes
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Next steps for this hierarchy level:** run `/to-tickets` against this Feature — it breaks the spec into `type: issue` tickets linked as sub-issues of this Feature, and applies `ready-for-agent`.
