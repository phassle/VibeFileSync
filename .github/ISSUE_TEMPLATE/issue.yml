name: "Issue"
description: "A tracer-bullet ticket — normally produced by the /to-tickets skill, not filled in by hand. Sits under a Feature."
title: "[Issue] "
labels:
  - "type: issue"
body:
  - type: markdown
    attributes:
      value: |
        An **Issue** is one tracer-bullet ticket: a narrow but complete vertical slice through every layer it touches, sized to fit a single agent session. It is normally generated by the `/to-tickets` skill, not written from a blank template.

        Write everything in English, even if the discussion that produced it happened in another language.

  - type: input
    id: parent
    attributes:
      label: Parent Feature
      description: Link (or #number) of the Feature this ticket belongs to.
    validations:
      required: false

  - type: textarea
    id: what-to-build
    attributes:
      label: What to build
      description: The end-to-end behaviour this ticket makes work, from the user's perspective — not a layer-by-layer implementation list.
    validations:
      required: true

  - type: input
    id: crap-score
    attributes:
      label: CRAP score
      description: Estimated complexity/maintenance burden for this ticket (for example 1-10, or low/medium/high).
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checklist of criteria that must hold for this ticket to be done.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Other tickets that must complete before this one can start, or "None — can start immediately".
    validations:
      required: false
