[package]
name = "vibesync"
version = "0.1.0"
edition = "2021"

[features]
fault-injection = []

[[bin]]
name = "vibesync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tempfile = "3"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
