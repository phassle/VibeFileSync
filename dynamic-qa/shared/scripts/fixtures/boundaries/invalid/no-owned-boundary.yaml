# Violates rule: exactly one boundary must declare role: owned. Here none
# does -- the flow never says which boundary is the outcome under test, so
# it is refused rather than guessed.
schema: dynamic-qa-flow-v1
id: no-owned-boundary-flow
revision: 1
title: "Boundary policy violation: no owned boundary declared"
intent: "Prove a flow with no role: owned boundary is rejected."
criticality: high
state: draft
origin:
  tickets:
    - "https://github.com/phassle/VibeFileSync/issues/18"
test_level:
  selection: inferred
data_sets: []
boundaries:
  - id: vibesync-cli
    system: "vibesync CLI"
    treatment: real
    behavior: "Invoke the CLI's Update mode against a temporary folder pair."
    side_effects: "none"
steps:
  - id: given-a
    kind: given
    intent: "i"
  - id: when-b
    kind: when
    intent: "i"
  - id: then-c
    kind: then
    intent: "i"
    outcomes:
      - id: outcome-a
        expect: "exact one."
