# Violates rule: a forbidden boundary must be honourable -- it may claim no
# side effects. Here it claims real side effects, so the declaration cannot
# be honoured and is refused rather than silently downgraded to simulated.
schema: dynamic-qa-flow-v1
id: forbidden-with-side-effects-flow
revision: 1
title: "Boundary policy violation: forbidden boundary claims side effects"
intent: "Prove a forbidden boundary with non-none side_effects is rejected."
criticality: high
state: draft
origin:
  tickets:
    - "https://github.com/phassle/VibeFileSync/issues/18"
test_level:
  selection: inferred
data_sets: []
boundaries:
  - id: vibesync-cli
    system: "vibesync CLI"
    treatment: real
    behavior: "Invoke the CLI's Update mode against a temporary folder pair."
    side_effects: "none"
    role: owned
  - id: production-paths
    system: "production paths, user HOME, and external volumes"
    treatment: forbidden
    behavior: "No production or home-directory path is read or written."
    side_effects: "Deletes files under the user's home directory."
steps:
  - id: given-a
    kind: given
    intent: "i"
  - id: when-b
    kind: when
    intent: "i"
  - id: then-c
    kind: then
    intent: "i"
    outcomes:
      - id: outcome-a
        expect: "exact one."
