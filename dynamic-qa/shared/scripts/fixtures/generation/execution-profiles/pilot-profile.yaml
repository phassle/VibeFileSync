# Fixture for preflight.test.mjs (#153): a complete, well-formed Execution
# Profile that honours flow-active.yaml's boundaries — "vibesync-cli" is the
# one real, owned boundary flow-active.yaml declares, and this profile's
# effects.allowedBoundaryIds names exactly that id.
schema: dynamic-qa-execution-profile-v1
id: pilot-profile
revision: 1
owners:
  qaOwner: Per
  technicalOwner: Alex
allowedPhases:
  - candidate-verification
  - pr
allowedTestLevels:
  - cli
environments:
  runnerClass: github-hosted-ubuntu
  disposable: true
  disposabilityEvidence: fresh hosted VM per job, destroyed after
  sandbox: vm
paths:
  allowedRead:
    - /repo
  allowedWrite:
    - /repo/tmp
commands:
  allowed:
    - npm test
resources:
  maxProcesses: 4
  maxCpuSeconds: 60
  maxMemoryMb: 512
  maxFileSizeMb: 10
  maxWallTimeSeconds: 120
identities:
  approvedNonProduction:
    - ci-bot
  denyProduction:
    - prod-service-account
  denyMetadata:
    - "169.254.169.254"
network:
  mode: none
effects:
  allowedBoundaryIds:
    - vibesync-cli
  reversibleSideEffects: true
  namespace: "run-${case.id}"
  cleanup: "remove the per-run temp tree"
credentials: {}
diagnostics:
  classes: []
  captureConditions:
    - failure-only
  scrubber: redact-secrets
  maxSizeMb: 5
  audience: qa-owner
  retentionDays: 7
evidence:
  adapter: github-actions
  capabilities:
    - capability: runtime.node-available
      category: evidence
